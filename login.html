<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BDC Vault | Borrower Sign In</title>
  
  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BDC Vault">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Firebase App & Auth SDK (v10.12.0) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDd-YKspjMz-lWUWCdBe1zplzNCDWsM1mA",
      authDomain: "bdc-vault.firebaseapp.com",
      projectId: "bdc-vault",
      storageBucket: "bdc-vault.firebasestorage.app",
      messagingSenderId: "119058571389",
      appId: "1:119058571389:web:107cafd0ea4c19823cd114",
      measurementId: "G-KT6K937JT7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    window.firebaseBorrowerAuth = {
      loginWithGoogle: async function() {
        const btn = document.getElementById('googleSignInBtn');
        const status = document.getElementById('loginStatus');
        btn.disabled = true;
        btn.innerHTML = '⏳ Connecting to Google...';
        status.style.display = 'none';

        try {
          const result = await signInWithPopup(auth, provider);
          const user = result.user;
          const email = (user.email || "").toLowerCase().trim();

          btn.innerHTML = '🔍 Verifying account...';
          const res = await fetchBankApi('google_login', { email: email });

          if (res && res.success) {
            sessionStorage.setItem('bdc_client_session', JSON.stringify({
              clientName: res.clientName,
              email: res.email,
              photoURL: user.photoURL || null,
              authMethod: 'google'
            }));

            status.style.display = 'block';
            status.style.color = '#34d399';
            status.innerText = `✅ Welcome, ${res.clientName}! Unlocking statement...`;
            setTimeout(() => {
              window.location.href = "portal.html";
            }, 700);
          } else {
            await signOut(auth);
            btn.disabled = false;
            btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg> Sign in with Google`;
            status.style.display = 'block';
            status.style.color = '#fb7185';
            status.innerText = `❌ ${res ? res.message : 'No borrower account associated with ' + email}`;
          }
        } catch(err) {
          console.error("Borrower Auth Error:", err);
          btn.disabled = false;
          btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg> Sign in with Google`;
          status.style.display = 'block';
          status.style.color = '#fb7185';
          status.innerText = "❌ Google sign-in was cancelled or encountered an error.";
        }
      }
    };
  </script>

  <style>
    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      margin: 50px auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: white;
      color: #1f2937;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 14px 24px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
    }
    .btn-google:hover {
      background: #f1f5f9;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <div class="container">
    <nav class="navbar">
      <a href="index.html" class="brand">
        <div class="brand-logo">💎</div>
        <div>
          <div class="brand-title">BDC Vault <span class="bdc-version-tag" style="font-size:0.75rem; background:rgba(168,85,247,0.2); color:#d8b4fe; border:1px solid rgba(168,85,247,0.4); padding:1px 6px; border-radius:6px; font-weight:700; margin-left:4px;">v4.7.6</span></div>
          <span class="brand-sub">Borrower Portal</span>
        </div>
      </a>
      <a href="index.html" class="nav-link">Home ➔</a>
    </nav>

    <div class="login-card">
      <div style="font-size:36px; margin-bottom:12px;">💎</div>
      <h1 style="font-family:var(--font-heading); font-size:1.6rem; color:white; margin-bottom:6px;">Borrower Sign In</h1>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:20px;">Access your private loan statement and payment portal.</p>

      <div id="unauthAlert" style="display:none; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; padding:10px; border-radius:10px; font-size:0.85rem; margin-bottom:18px; font-weight:600;">
        🔒 Private Portal: Please sign in to view your account statement.
      </div>

      <!-- GOOGLE SIGN IN BUTTON -->
      <button id="googleSignInBtn" class="btn-google" onclick="window.firebaseBorrowerAuth.loginWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </button>

      <!-- DIVIDER -->
      <div style="display:flex; align-items:center; gap:12px; margin:22px 0 18px;">
        <div style="flex:1; height:1px; background:var(--border-color);"></div>
        <span style="color:var(--text-muted); font-size:0.75rem; text-transform:uppercase; font-weight:700; letter-spacing:1px;">or with password</span>
        <div style="flex:1; height:1px; background:var(--border-color);"></div>
      </div>

      <form onsubmit="handleWebLogin(event)">
        <div style="text-align:left; margin-bottom:16px;">
          <label style="display:block; font-size:0.85rem; color:#cbd5e1; font-weight:600; margin-bottom:6px;">Email Address</label>
          <input type="email" id="loginEmail" required placeholder="e.g. borrower@example.com" style="width:100%;">
        </div>

        <div style="text-align:left; margin-bottom:20px;">
          <label style="display:block; font-size:0.85rem; color:#cbd5e1; font-weight:600; margin-bottom:6px;">Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" style="width:100%;">
        </div>

        <button type="submit" class="btn-primary" id="loginBtn" style="width:100%; padding:15px; border-radius:12px; font-size:1rem;">
          Sign In with Password ➔
        </button>

        <div id="loginStatus" style="margin-top:16px; font-size:0.88rem; display:none; padding:10px; border-radius:10px;"></div>
      </form>

      <div style="display:flex; justify-content:space-between; margin-top:24px; font-size:0.85rem;">
        <a href="reset.html" style="color:var(--primary-purple); text-decoration:none;">Forgot password?</a>
        <a href="apply.html" style="color:var(--primary-purple); text-decoration:none;">Request Account</a>
      </div>
    </div>

    <footer>
      &copy; 2026 BDC Vault <span class="bdc-version-tag" style="color:#c084fc; font-weight:700; cursor:pointer;">v4.7.6</span> &bull; Private Client Portal
    </footer>
  </div>

  <script src="app.js"></script>
  <script src="pwa.js"></script>
  <script>
    // Check if redirected from unauthorized portal access
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('msg') === 'unauthorized') {
      document.getElementById('unauthAlert').style.display = 'block';
    }

    async function handleWebLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pw = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      const status = document.getElementById('loginStatus');

      btn.disabled = true;
      btn.innerText = "Authenticating...";
      status.style.display = 'none';

      try {
        const res = await fetchBankApi('login', { email: email, password: pw });
        btn.disabled = false;
        btn.innerText = "Sign In with Password ➔";

        if (res.success) {
          sessionStorage.setItem('bdc_client_session', JSON.stringify({
            clientName: res.clientName,
            email: res.email,
            authMethod: 'password'
          }));

          status.style.display = 'block';
          status.style.color = '#34d399';
          status.innerText = "✅ Welcome, " + res.clientName + "! Loading statement...";
          setTimeout(() => {
            window.location.href = "portal.html";
          }, 700);
        } else {
          status.style.display = 'block';
          status.style.color = '#fb7185';
          status.innerText = "❌ " + (res.message || "Invalid credentials.");
        }
      } catch(err) {
        btn.disabled = false;
        btn.innerText = "Sign In with Password ➔";
        status.style.display = 'block';
        status.style.color = '#fb7185';
        status.innerText = "❌ Authentication error. Please try again.";
      }
    }
  </script>
</body>
</html>
