<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="8" />

  <!-- Outer Ambient Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(168, 85, 247, 0.15)" stroke-width="4" stroke-dasharray="12 12" />

  <!-- Diamond Symbol Glow -->
  <g filter="url(#glow)">
    <!-- Main Diamond Facets -->
    <path d="M140 180 L256 90 L372 180 L256 420 Z" fill="url(#gemGrad)" opacity="0.9" />
    
    <!-- Facet Lines -->
    <path d="M140 180 L372 180" stroke="#ffffff" stroke-width="4" opacity="0.6" />
    <path d="M256 90 L256 420" stroke="#ffffff" stroke-width="4" opacity="0.6" />
    <path d="M200 180 L256 90 L312 180 L256 420 Z" fill="#ffffff" opacity="0.25" />
    <path d="M140 180 L256 260 L372 180" stroke="#ffffff" stroke-width="4" opacity="0.7" />
  </g>

  <!-- Top Crown Accent -->
  <circle cx="256" cy="90" r="10" fill="url(#goldGrad)" />
  <circle cx="140" cy="180" r="8" fill="url(#goldGrad)" />
  <circle cx="372" cy="180" r="8" fill="url(#goldGrad)" />
</svg>