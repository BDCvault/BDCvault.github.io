<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank of Diva | Client Statement Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-amount.Payment { color: #34d399; }
    .tx-amount.Loan, .tx-amount.Interest { color: #fb7185; }
  </style>
</head>
<body>

  <div class="container" style="max-width:640px;">
    
    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="index.html" class="brand">
        <div class="brand-logo">💎</div>
        <div>
          <div class="brand-title">Bank of Diva</div>
          <span class="brand-sub">Private Client Portal</span>
        </div>
      </a>
      <a href="index.html" class="nav-link">Home ➔</a>
    </nav>

    <div id="loader" style="text-align:center; padding:40px; color:var(--primary-purple); font-weight:600;">
      ⏳ Decrypting account ledger...
    </div>

    <div id="portalContent" style="display:none;">

      <!-- BALANCE CARD -->
      <div class="card" style="text-align:center; padding:32px 24px;">
        <div style="font-size:0.85rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--text-muted); font-weight:600; margin-bottom:8px;" id="clientHeader">
          Account Statement
        </div>
        <div style="font-family:var(--font-heading); font-size:3.2rem; font-weight:800; color:white; margin:6px 0 16px;" id="clientBalance">
          $0.00
        </div>
        
        <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
          <span class="badge badge-date" id="asOfDate">As of Today</span>
          <span class="badge badge-due" id="dueDateBadge">Next Due: Loading...</span>
        </div>

        <!-- PROGRESS BAR -->
        <div id="progressSection" style="display:none; margin-top:20px; padding-top:16px; border-top:1px solid var(--border-color);">
          <div style="background:rgba(255,255,255,0.08); height:10px; border-radius:20px; overflow:hidden; margin-bottom:8px;">
            <div id="progressBar" style="height:100%; width:0%; background:linear-gradient(90deg, #6366f1, #a855f7, #10b981); border-radius:20px; transition:width 1.5s;"></div>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-muted); font-weight:600;">
            <span id="progressText">0% Paid Off</span>
            <span id="principalText">Starting Principal</span>
          </div>
        </div>
      </div>

      <!-- TRANSACTIONS LEDGER -->
      <div class="card">
        <h3 style="font-family:var(--font-heading); font-size:1.2rem; margin-bottom:16px; color:white;">Transaction History</h3>
        <div id="txList">
          <!-- Injected -->
        </div>
      </div>

      <!-- ACTION BUTTONS -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:30px;" id="actionButtons">
        <a href="https://cash.app/$BrianDivaCox" target="_blank" class="btn-cashapp">
          💸 Cash App
        </a>
        <a href="https://venmo.com/u/BrianDivaCox" target="_blank" style="background:#008CFF; color:white; padding:14px; border-radius:12px; font-weight:700; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 4px 15px rgba(0,140,255,0.25);">
          📱 Venmo
        </a>
        <button class="btn-primary" onclick="downloadPDF()" style="grid-column: span 2;">
          📑 Download PDF Statement
        </button>
      </div>

    </div>

    <footer>
      BDC Vault &bull; Official Client Portal &bull; Cash App: $BrianDivaCox &bull; Venmo: @BrianDivaCox
    </footer>

  </div>

  <script src="app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const clientName = urlParams.get('client') || 'Client';

    function downloadPDF() {
      const el = document.getElementById('portalContent');
      const btns = document.getElementById('actionButtons');
      btns.style.display = 'none';

      const opt = {
        margin: 0.4,
        filename: `BankOfDiva_Statement_${clientName}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, backgroundColor: '#090d16' },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(el).save().then(() => {
        btns.style.display = 'grid';
      });
    }

    window.onload = async function() {
      document.getElementById('clientHeader').innerText = `Account Statement &bull; ${clientName}`;
      document.getElementById('asOfDate').innerText = `As of ${new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;

      // Fetch live data from API
      const data = await fetchBankApi('ledger', { client: clientName });

      document.getElementById('loader').style.display = 'none';
      document.getElementById('portalContent').style.display = 'block';

      let ledger = (data && data.ledger) ? data.ledger : [
        [new Date().toLocaleDateString(), "Payment", "Cash App Settlement", 250, 4750],
        [new Date().toLocaleDateString(), "Interest", "Monthly Accrued Interest (27.9% APR)", 116.25, 5000],
        [new Date().toLocaleDateString(), "Loan", "Starting Loan Principal", 5000, 5000]
      ];

      const principal = (data && data.profile && data.profile.startingPrincipal) ? data.profile.startingPrincipal : 5000;
      const lastTx = ledger[ledger.length - 1];
      const balance = parseFloat(lastTx[4]) || 0;

      document.getElementById('clientBalance').innerText = formatMoney(balance);

      if (principal > 0) {
        document.getElementById('progressSection').style.display = 'block';
        let percent = Math.min(100, Math.max(0, ((principal - balance) / principal) * 100));
        setTimeout(() => {
          document.getElementById('progressBar').style.width = percent + '%';
        }, 100);
        document.getElementById('progressText').innerText = percent.toFixed(1) + '% Paid Off';
        document.getElementById('principalText').innerText = `Principal: ${formatMoney(principal)}`;
      }

      // Next due
      const today = new Date();
      let nextDue = new Date(today.getFullYear(), today.getMonth(), 11);
      if (today.getDate() > 11) nextDue.setMonth(nextDue.getMonth() + 1);
      const diffDays = Math.ceil(Math.abs(nextDue - today) / (1000 * 60 * 60 * 24));
      
      const dueBadge = document.getElementById('dueDateBadge');
      if (balance <= 0) {
        dueBadge.innerText = 'Paid in Full 🎉';
        dueBadge.className = 'badge badge-paid';
      } else {
        dueBadge.innerText = `Next Due: ${nextDue.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} (${diffDays} days)`;
        dueBadge.className = 'badge badge-due';
      }

      // Render transactions
      const txContainer = document.getElementById('txList');
      let html = '';
      [...ledger].reverse().forEach(tx => {
        const type = tx[1];
        const desc = tx[2];
        const amt = parseFloat(tx[3]) || 0;
        const displayAmt = (type === 'Payment' || amt < 0) ? `-${formatMoney(amt)}` : `+${formatMoney(amt)}`;
        html += `
          <div class="tx-item">
            <div>
              <div style="font-weight:600; color:white;">${desc}</div>
              <div style="font-size:0.78rem; color:var(--text-muted); margin-top:2px;">${tx[0]} &bull; ${type}</div>
            </div>
            <div class="tx-amount ${type}" style="font-family:var(--font-heading); font-weight:700; font-size:1.1rem;">${displayAmt}</div>
          </div>
        `;
      });
      txContainer.innerHTML = html;
    };
  </script>
</body>
</html>
